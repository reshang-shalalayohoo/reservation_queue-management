# =============================================
# VikingsERP - Docker Compose Configuration
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f
# Seed:   docker compose exec backend node seed.js
# =============================================

services:
  # ------------------------------------------
  # MySQL Database
  # ------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: vikingserp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: resquedb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345678"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vikingserp-network

  # ------------------------------------------
  # Node.js + Express.js Backend
  # ------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vikingserp-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: 12345678
      DB_NAME: resquedb
      JWT_SECRET: viking_grill_jwt_secret_key_2024
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - vikingserp-network

  # ------------------------------------------
  # React.js + Vite Frontend
  # ------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vikingserp-frontend
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - vikingserp-network

# ------------------------------------------
# Persistent Volumes
# ------------------------------------------
volumes:
  mysql_data:
    name: vikingserp-mysql-data

# ------------------------------------------
# Network
# ------------------------------------------
networks:
  vikingserp-network:
    name: vikingserp-network
    driver: bridge
